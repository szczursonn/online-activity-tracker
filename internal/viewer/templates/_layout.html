<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{template "title" .}} | online-activity-tracker</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.4/css/bulma.min.css"
      integrity="sha512-yh2RE0wZCVZeysGiqTwDTO/dKelCbS9bP2L94UvOFtl/FKXcNAje3Y2oBg/ZMZ3LS1sicYk4dYVGtDex75fvvA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      @view-transition {
        navigation: auto;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 100ms;
        animation-timing-function: ease;
      }
    </style>
    {{block "head" .}}{{end}}
  </head>
  <body style="margin-left: 5%; margin-right: 5%">
    <header class="mb-4">
      <h1
        class="is-size-1-tablet is-size-3-mobile has-text-centered has-text-weight-semibold mb-2"
      >
        online-activity-tracker
      </h1>
      <nav class="columns is-mobile is-multiline is-variable is-1">
        {{range navLinks}}
        <div class="column is-half-mobile">
          <a href="{{.Href}}" class="box media is-align-items-center">
            <figure class="media-left image is-32x32">
              <img src="{{.IconURL}}" alt="{{.IconAlt}}" />
            </figure>
            <div class="media-content">
              <p class="title is-5 is-size-6-mobile">{{.Label}}</p>
            </div>
          </a>
        </div>
        {{end}}
      </nav>
    </header>
    <hr />
    <main>{{template "body" .}}</main>
    <a
      href="https://github.com/szczursonn/online-activity-tracker"
      target="_blank"
      rel="noopener"
      style="
        position: fixed;
        top: 0.5rem;
        right: 0.75rem;
        z-index: 50;
        filter: invert(1);
        opacity: 20%;
      "
    >
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
        alt="github logo"
        width="32"
      />
    </a>
  </body>
</html>
