{{define "title"}}{{if .User.Name}}{{.User.Name}}{{else}}{{.User.ID}}{{end}} |
Discord Users{{end}} {{define "body"}} {{template "timelinePageHeader" .Header}}

<div id="discord-timeline"></div>

<script id="dataHeartbeat" type="application/json">
  {{.Heartbeat}}
</script>

<script id="dataStatusSessions" type="application/json">
  {{.StatusSessions}}
</script>

<script id="dataActivitySessions" type="application/json">
  {{.ActivitySessions}}
</script>

<script id="dataVoiceSessions" type="application/json">
  {{.VoiceSessions}}
</script>

<script>
  "use strict";
  {
    const STATUS_TO_LABEL = Object.freeze({
      0: "Online",
      1: "DND",
      2: "Idle",
      3: "Offline",
    });

    const STATUS_TO_COLOR = Object.freeze({
      Online: "#00ff00",
      DND: "#ff0000",
      Idle: "#ffff00",
      Offline: "#808080",
    });

    const statusToLabel = (status) => STATUS_TO_LABEL[status] || status;

    const heartbeat = OatSessionsTimeline.readJSON(
      document.getElementById("dataHeartbeat"),
    );

    new OatSessionsTimeline({
      container: document.getElementById("discord-timeline"),
      toColor: (val) => STATUS_TO_COLOR[val],
      tooltip: (segment) => {
        if (segment._status) {
          return [
            `Desktop: ${statusToLabel(segment._status.desktop_status)}`,
            `Mobile: ${statusToLabel(segment._status.mobile_status)}`,
            `Web: ${statusToLabel(segment._status.web_status)}`,
          ];
        }

        if (segment._activity) {
          return [segment._activity.details, segment._activity.state].filter(
            Boolean,
          );
        }

        return [];
      },
      groups: [
        OatSessionsTimeline.buildGroup({
          label: "Status",
          sessions: OatSessionsTimeline.readJSON(
            document.getElementById("dataStatusSessions"),
          ),
          heartbeat,
          toSegment: (session) => ({
            start: session.start_observed_at,
            end: session.end_observed_at,
            // the most "online" of the clients wins
            val:
              STATUS_TO_LABEL[
                Math.min(
                  session.desktop_status,
                  session.mobile_status,
                  session.web_status,
                )
              ] || STATUS_TO_LABEL[3],
            _status: session,
          }),
        }),
        OatSessionsTimeline.buildGroup({
          label: "Activity",
          sessions: OatSessionsTimeline.readJSON(
            document.getElementById("dataActivitySessions"),
          ),
          heartbeat,
          toKey: (session) => session.name,
          toLabel: (session) => session.name,
          toSegment: (session) => ({
            start: session.start_observed_at,
            end: session.end_observed_at,
            val: session.name,
            _activity: session,
          }),
        }),
        OatSessionsTimeline.buildGroup({
          label: "Voice",
          sessions: OatSessionsTimeline.readJSON(
            document.getElementById("dataVoiceSessions"),
          ),
          heartbeat,
          toKey: (session) => session.guild_id,
          toLabel: (session) => session.guild_name || session.guild_id,
          toSegment: (session) => ({
            start: session.start_observed_at,
            end: session.end_observed_at,
            val: session.channel_name || session.channel_id,
          }),
        }),
      ],
    });
  }
</script>

{{end}}
