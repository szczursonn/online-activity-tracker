{{define "title"}}{{if .User.Name}}{{.User.Name}}{{else}}{{.User.ID}}{{end}} |
Steam Users{{end}} {{define "body"}} {{template "timelinePageHeader" .Header}}

<div id="steam-timeline"></div>

<script id="dataHeartbeat" type="application/json">
  {{.Heartbeat}}
</script>

<script id="dataPersonaStateSessions" type="application/json">
  {{.PersonaStateSessions}}
</script>

<script id="dataAppSessions" type="application/json">
  {{.AppSessions}}
</script>

<script>
  "use strict";
  {
    const PERSONA_STATE_TO_LABEL = Object.freeze({
      0: "Offline",
      1: "Online",
      2: "Busy",
      3: "Away",
      4: "Snooze",
      5: "Looking to trade",
      6: "Looking to play",
    });

    const PERSONA_STATE_LABEL_TO_COLOR = Object.freeze({
      Offline: "#808080",
      Online: "#00ff00",
      Busy: "#ff0000",
      Away: "#ffff00",
    });

    const heartbeat = OatSessionsTimeline.readJSON(
      document.getElementById("dataHeartbeat"),
    );

    new OatSessionsTimeline({
      container: document.getElementById("steam-timeline"),
      toColor: (val) => PERSONA_STATE_LABEL_TO_COLOR[val],
      groups: [
        OatSessionsTimeline.buildGroup({
          label: "Persona State",
          sessions: OatSessionsTimeline.readJSON(
            document.getElementById("dataPersonaStateSessions"),
          ),
          heartbeat,
          toSegment: (session) => ({
            start: session.first_observed_at,
            end: session.last_observed_at,
            val:
              PERSONA_STATE_TO_LABEL[session.persona_state] ||
              session.persona_state.toString(),
          }),
        }),
        OatSessionsTimeline.buildGroup({
          label: "App",
          sessions: OatSessionsTimeline.readJSON(
            document.getElementById("dataAppSessions"),
          ),
          heartbeat,
          toKey: (session) => session.app_id,
          toLabel: (session) => session.app_name || session.app_id,
          toSegment: (session) => ({
            start: session.first_observed_at,
            end: session.last_observed_at,
            val: session.app_name || session.app_id,
          }),
        }),
      ],
    });
  }
</script>

{{end}}
